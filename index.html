<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Psicosexual</title>
    <!-- Logo en la pestaña del navegador -->
    <link rel="icon" type="image/png" href="logo.png">
    
    <!-- Importación de Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #201314;
            --glass-bg: rgba(48, 30, 32, 0.45);
            --glass-border: rgba(193, 149, 146, 0.25);
            --glass-hover: rgba(65, 38, 41, 0.65);
            --accent-main: #c19592; 
            --accent-strong: #a36b67; 
            --text-main: #f0d8cd;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 0%, #42282a 0%, #201314 70%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            min-height: 100vh;
        }

        /* Barra de navegación en formato Cápsula Flotante (Efecto Cristal) */
        header {
            background-color: transparent;
            padding: 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-capsule {
            background-color: rgba(35, 21, 23, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 10px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 1100px;
            box-sizing: border-box;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 500;
            font-size: 16px;
            letter-spacing: 0.5px;
        }

        .nav-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a:not(.insta-btn), .dropdown > a {
            text-decoration: none;
            color: #f0d8cd;
            font-weight: 500;
            font-size: 13px;
            transition: color 0.2s;
            cursor: pointer;
            background: none;
            border: none;
            font-family: 'Poppins', sans-serif;
            padding: 5px 0;
            letter-spacing: 0.3px;
        }

        .nav-links a:not(.insta-btn):hover, .dropdown > a:hover {
            color: var(--accent-main);
        }

        /* Menú Desplegable interactivo por Clic */
        .dropdown {
            position: relative;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 130%;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(35, 21, 23, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            width: 260px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border-radius: 16px;
            padding: 8px 0;
            border: 1px solid var(--glass-border);
            z-index: 1100;
            list-style: none;
            text-align: center;
            box-sizing: border-box;
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-menu li a {
            display: block;
            padding: 10px 15px;
            color: #f0d8cd;
            text-decoration: none;
            font-size: 12px;
            transition: background 0.2s, color 0.2s;
            white-space: normal;
            line-height: 1.4;
            cursor: pointer;
        }

        .dropdown-menu li a:hover {
            background-color: var(--accent-strong);
            color: #ffffff;
        }

        .insta-btn {
            background-color: var(--accent-strong);
            color: #ffffff !important;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
            text-decoration: none;
            transition: transform 0.2s, background-color 0.2s;
        }

        .insta-btn:hover {
            background-color: var(--accent-main);
            transform: translateY(-1px);
        }

        /* Menú Hamburguesa para celulares */
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            flex-direction: column;
            gap: 4px;
            padding: 4px;
        }

        .menu-toggle span {
            width: 22px;
            height: 2px;
            background-color: #ffffff;
            border-radius: 2px;
        }

        /* Contenedor principal para las demás secciones */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 20px;
        }

        /* --- HERO FULL-WIDTH --- */
        .hero-section {
            width: 100%;
            margin: 0 0 50px 0;
            background-color: rgba(35, 21, 23, 0.4);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            padding: 70px 40px;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
            display: flex;
            align-items: center;
        }

        .hero-bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            opacity: 0.45; 
            pointer-events: none;
        }

        .hero-section::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, rgba(32, 19, 20, 0.95) 45%, rgba(32, 19, 20, 0.6) 80%, rgba(32, 19, 20, 0.2) 100%);
            z-index: 2;
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 3;
            max-width: 700px;
            margin-left: 5%;
            text-align: left;
        }

        .hero-badge {
            display: inline-block;
            background-color: rgba(193, 149, 146, 0.2);
            backdrop-filter: blur(8px);
            color: #ffffff;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
            border: 1px solid var(--glass-border);
        }

        .hero-title {
            font-size: 42px;
            font-weight: 700;
            margin: 0 0 15px 0;
            line-height: 1.2;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .hero-subtitle {
            font-size: 16px;
            color: #f0d8cd; 
            margin: 0 0 25px 0;
            line-height: 1.5;
            font-weight: 400;
        }

        .hero-inline-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding-top: 20px;
            border-top: 1px solid var(--glass-border);
        }

        .hero-inline-btn {
            background-color: rgba(50, 31, 33, 0.6);
            backdrop-filter: blur(10px);
            color: #f0d8cd;
            border: 1px solid var(--glass-border);
            padding: 9px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Poppins', sans-serif;
            text-decoration: none;
        }

        .hero-inline-btn:hover {
            background-color: var(--accent-strong);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(163, 107, 103, 0.4);
        }

        /* Secciones */
        section {
            margin-bottom: 50px;
            scroll-margin-top: 100px;
        }

        .section-heading {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
            border-left: 5px solid var(--accent-strong);
            padding-left: 12px;
            color: #ffffff;
        }

        .collapsible-section {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        .collapsible-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Grilla adaptable (Quiénes Somos) sin bordes de tarjeta */
        .team-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
            align-items: start;
        }

        .team-card {
            background: none;
            border: none;
            padding: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            box-sizing: border-box;
        }

        .team-card-content {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 20px;
            align-items: start;
        }

        .team-img-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .team-img {
            width: 140px;
            height: 140px;
            object-fit: contain;
        }

        .team-info {
            text-align: left;
        }

        .team-card p {
            font-size: 13px;
            color: #f0d8cd;
            margin: 0 0 15px 0;
            line-height: 1.5;
            text-align: left;
        }

        .linkedin-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(193, 149, 146, 0.15);
            backdrop-filter: blur(8px);
            color: #f0d8cd;
            border: 1px solid var(--glass-border);
            padding: 6px 14px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            text-align: center;
        }

        .linkedin-btn:hover {
            background-color: var(--accent-strong);
            color: #fff;
        }

        .linkedin-pc {
            display: inline-flex;
        }

        .linkedin-mobile {
            display: none;
        }

        /* --- CARRUSEL DE REELS --- */
        .carousel-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .reels-carousel {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            scroll-behavior: smooth;
            scrollbar-width: none;
            padding: 10px 5px;
            width: 100%;
        }

        .reels-carousel::-webkit-scrollbar {
            display: none;
        }

        /* Tarjetas de Reels con Efecto Cristal Difuso */
        .reel-card {
            flex: 0 0 210px;
            background-color: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-decoration: none;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
        }

        .reel-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-main);
            box-shadow: 0 15px 35px rgba(163, 107, 103, 0.3);
        }

        .reel-img {
            width: 100%;
            aspect-ratio: 9/16;
            object-fit: cover;
            display: block;
        }

        .reel-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(35, 21, 23, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            padding: 15px;
            text-align: center;
            box-sizing: border-box;
        }

        .reel-card:hover .reel-overlay {
            opacity: 1;
        }

        .reel-overlay span {
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            background-color: var(--accent-strong);
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(50, 31, 33, 0.8);
            backdrop-filter: blur(8px);
            color: #fff;
            border: 1px solid var(--glass-border);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: background-color 0.2s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .carousel-btn:hover {
            background-color: var(--accent-strong);
            transform: translateY(-50%) scale(1.05);
        }

        .carousel-btn.prev {
            left: -20px;
        }

        .carousel-btn.next {
            right: -20px;
        }

        /* --- ESTILOS: SECCIÓN SALUD SEXUAL (Efecto Cristal Difuso) --- */
        .salud-sexual-container {
            background-color: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
        }

        .salud-cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        /* Cuadrados principales de Salud Sexual con bordes difusos suaves */
        .salud-card-item {
            background: linear-gradient(135deg, rgba(60, 35, 38, 0.5), rgba(40, 22, 24, 0.5));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 140px;
        }

        .salud-card-item:hover, .salud-card-item.active-tab {
            transform: translateY(-5px);
            background: linear-gradient(135deg, rgba(85, 48, 52, 0.7), rgba(55, 30, 33, 0.7));
            border-color: var(--accent-main);
            box-shadow: 0 12px 35px rgba(163, 107, 103, 0.35);
        }

        .salud-card-title {
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            margin: 0;
            letter-spacing: 0.3px;
        }

        .salud-content-display {
            background: rgba(35, 21, 23, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
            color: #f0d8cd;
        }

        .salud-content-display.active {
            display: block;
        }

        .salud-content-display h4 {
            margin-top: 0;
            color: #ffffff;
            font-size: 18px;
            margin-bottom: 15px;
        }

        /* --- BOTONES DE MÉTODOS --- */
        .metodos-subtabs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin-top: 20px;
            margin-bottom: 25px;
        }

        .metodo-sub-btn {
            background: rgba(50, 31, 33, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            color: #f0d8cd;
            padding: 14px 18px;
            border-radius: 16px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .metodo-sub-btn:hover {
            background-color: rgba(163, 107, 103, 0.4);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .metodo-sub-btn.active {
            background-color: var(--accent-strong);
            color: #ffffff;
            border-color: var(--accent-main);
            box-shadow: 0 4px 15px rgba(163, 107, 103, 0.4);
        }

        .sub-menu-container {
            display: none;
            background: rgba(45, 25, 28, 0.5);
            backdrop-filter: blur(10px);
            border: 1px dashed rgba(193, 149, 146, 0.35);
            border-radius: 16px;
            padding: 20px;
            margin-top: 15px;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease-in-out;
        }

        .sub-menu-container.active {
            display: block;
        }

        .sub-menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }

        .sub-menu-btn {
            background: rgba(35, 21, 23, 0.7);
            backdrop-filter: blur(6px);
            border: 1px solid var(--glass-border);
            color: #f0d8cd;
            padding: 10px 14px;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .sub-menu-btn:hover {
            background-color: var(--accent-strong);
            color: #ffffff;
        }

        .sub-menu-btn.active {
            background-color: var(--accent-strong);
            color: #ffffff;
            border-color: var(--accent-main);
            font-weight: 600;
        }

        .metodo-detalle-box {
            display: none;
            background: rgba(45, 25, 28, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 22px;
            margin-top: 15px;
            animation: fadeIn 0.3s ease-in-out;
            line-height: 1.6;
            font-size: 13.5px;
        }

        .metodo-detalle-box.active {
            display: block;
        }

        .metodo-detalle-box h5 {
            color: #ffffff;
            font-size: 16px;
            margin-top: 0;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 8px;
        }

        .metodo-detalle-box p {
            margin-bottom: 12px;
        }

        /* --- CLASE "VER MÁS" --- */
        .extra-content {
            display: block;
        }

        .ver-mas-btn {
            display: none;
            background: rgba(193, 149, 146, 0.15);
            backdrop-filter: blur(6px);
            color: #ffffff;
            border: 1px solid var(--glass-border);
            padding: 6px 14px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            font-family: 'Poppins', sans-serif;
            transition: background 0.2s;
        }

        .ver-mas-btn:hover {
            background-color: var(--accent-strong);
        }

        /* --- NUBECITAS PARA CONSENTIMIENTO Y VÍNCULOS --- */
        .nubes-consentimiento-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .nube-card {
            background: linear-gradient(135deg, rgba(55, 33, 36, 0.6), rgba(38, 22, 24, 0.6));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 35px 35px 25px 35px;
            padding: 25px 22px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .nube-card:hover {
            background: linear-gradient(135deg, rgba(140, 90, 88, 0.75), rgba(95, 55, 53, 0.85));
            border-color: #ffffff;
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 14px 35px rgba(163, 107, 103, 0.4);
            color: #ffffff;
        }

        .nube-card p {
            margin: 0;
            font-size: 13.5px;
            line-height: 1.5;
